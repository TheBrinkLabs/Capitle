name: capitle
description: Daily capital city guessing game
publish_to: 'none'
version: 1.0.3+32

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local persistence
  shared_preferences: ^2.2.2
  http: ^1.2.0
  
  # Fonts
  google_fonts: ^6.1.0

  # Ads
  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2

  # Sharing
  share_plus: ^7.2.2

  # App icon generation (dev)
  flutter_launcher_icons: ^0.13.1

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  package_info_plus: ^9.0.1
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.2
  flutter_svg: ^2.3.0
  in_app_update: ^5.0.0
  unity_ads_plugin: ^0.4.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/textures/slate_grain.png
    - assets/outlines/
    - assets/maps/
    - assets/data/globe_countries.json

